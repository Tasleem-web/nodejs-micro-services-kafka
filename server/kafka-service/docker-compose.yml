services:
  kafka-broker-1:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-1
    environment:
      # Enable KRaft mode (Kafka Raft Metadata mode) for this broker
      KAFKA_ENABLE_KRAFT: "yes"
      # Set the Kafka broker ID to 1 (unique identifier for this broker)
      KAFKA_BROKER_ID: "1"
      # Unique identifier for this Kafka node
      KAFKA_NODE_ID: "1"
      # Specify the roles of this Kafka node
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Listen on all interfaces for external access
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
      # Advertise the external listener for access from outside the Docker network
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker-1:9092,EXTERNAL://localhost:9094"
      # Specify the controller quorum voters (list of controllers)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093"
      # Map the listener names to their security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      # Specify the controller listener name
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Specify the inter-broker listener name
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Allow plaintext listener for simplicity (not recommended for production)
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Enable auto-creation of topics and set replication factors for internal topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Set replication factor for the offsets topic
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Set replication factor for the transaction state log
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      # Set minimum in-sync replicas for the transaction state log
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Unique identifier for the KRaft cluster
      KAFKA_KRAFT_CLUSTER_ID: "baa7def3-aefb-4b0a-9ef0-721d96284235"
    ports:
      - "9094:9094"
    networks:
      - kafka-network

  kafka-broker-2:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-2
    environment:
      # Enable KRaft mode (Kafka Raft Metadata mode) for this broker
      KAFKA_ENABLE_KRAFT: "yes"
      # Set the Kafka broker ID to 2 (unique identifier for this broker)
      KAFKA_BROKER_ID: "2"
      # Unique identifier for this Kafka node
      KAFKA_NODE_ID: "2"
      # Specify the roles of this Kafka node
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Listen on all interfaces for external access
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9095"
      # Advertise the external listener for access from outside the Docker network
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker-2:9092,EXTERNAL://localhost:9095"
      # Specify the controller quorum voters
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093"
      # Map the listener names to their security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      # Specify the controller listener name
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Specify the inter-broker listener name
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Allow plaintext listener for simplicity (not recommended for production)
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Enable auto-creation of topics and set replication factors for internal topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Set replication factor for the offsets topic
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Set replication factor for the transaction state log
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      # Set minimum in-sync replicas for the transaction state log
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Unique identifier for the KRaft cluster
      KAFKA_KRAFT_CLUSTER_ID: "baa7def3-aefb-4b0a-9ef0-721d96284235"
    ports:
      - "9095:9095"
    networks:
      - kafka-network

  kafka-broker-3:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-3
    environment:
      # Enable KRaft mode (Kafka Raft Metadata mode) for this broker
      KAFKA_ENABLE_KRAFT: "yes"
      # Set the Kafka broker ID to 3 (unique identifier for this broker)
      KAFKA_BROKER_ID: "3"
      # Unique identifier for this Kafka node
      KAFKA_NODE_ID: "3"
      # Specify the roles of this Kafka node
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Listen on all interfaces for external access
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9096"
      # Advertise the external listener for access from outside the Docker network
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker-3:9092,EXTERNAL://localhost:9096"
      # Specify the controller quorum voters
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093"
      # Map the listener names to their security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      # Specify the controller listener name
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Specify the inter-broker listener name
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Allow plaintext listener for simplicity (not recommended for production)
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Enable auto-creation of topics and set replication factors for internal topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Set replication factor for the offsets topic
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Set replication factor for the transaction state log
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      # Set minimum in-sync replicas for the transaction state log
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Unique identifier for the KRaft cluster
      KAFKA_KRAFT_CLUSTER_ID: "baa7def3-aefb-4b0a-9ef0-721d96284235"
    ports:
      - "9096:9096"
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
      - KAFKA_CLUSTERS_0_READONLY=false
      - KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE=true
    ports:
      - "8080:8080"
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
